<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteHub</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f7f7fb;
color:#191827;
padding-bottom:85px
}

header{
height:64px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:5
}

.logo{
font-size:23px;
font-weight:800;
color:#6246e5
}

.icons{
display:flex;
gap:18px;
font-size:24px
}

.container{
max-width:600px;
margin:auto;
padding:18px
}

.banner{
background:linear-gradient(
135deg,
#7048ee,
#9d72ff
);
border-radius:20px;
padding:24px;
color:white;
min-height:155px;
display:flex;
flex-direction:column;
justify-content:center;
box-shadow:0 12px 30px #7652e544
}

.banner h1{
font-size:25px;
margin-bottom:8px
}

.banner p{
opacity:.9;
font-size:14px
}

.deposit{
margin-top:18px;
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:0 5px 20px #00000008
}

.deposit-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px
}

.deposit h3{
font-size:15px;
color:#777
}

.balance{
font-size:28px;
font-weight:800;
margin:8px 0
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.btn{
border:0;
background:#6848e8;
color:white;
padding:10px 16px;
border-radius:10px;
font-weight:bold;
cursor:pointer
}

.withdraw-btn{
background:#191827
}

.quick{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:20px 0
}

.quick div{
background:white;
border-radius:15px;
padding:15px 5px;
text-align:center;
box-shadow:0 5px 18px #00000008;
font-size:12px;
cursor:pointer
}

.quick b{
display:block;
font-size:23px;
margin-bottom:7px
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 0 12px
}

.section-title h2{
font-size:18px
}

.section-title span{
color:#6848e8;
font-size:13px
}

.coin{
background:#fff;
border-radius:17px;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px;
box-shadow:0 5px 18px #00000008;
cursor:pointer;
transition:.15s
}

.coin:active{
transform:scale(.98)
}

.coin-left{
display:flex;
align-items:center;
gap:12px
}

.coin-icon{
width:43px;
height:43px;
border-radius:50%;
background:#f0edff;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
font-weight:bold;
color:#6848e8
}

.coin-name b{
display:block
}

.coin-name small{
color:#999
}

.price{
text-align:right
}

.price b{
display:block
}

.green{
color:#20a66a;
font-size:12px
}

.red{
color:#e54848;
font-size:12px
}

.loading{
color:#999;
font-size:13px
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:white;
border-top:1px solid #eee;
display:flex;
justify-content:space-around;
align-items:center;
z-index:10
}

.bottom div{
text-align:center;
font-size:11px;
color:#999;
cursor:pointer;
width:20%
}

.bottom b{
display:block;
font-size:21px;
margin-bottom:4px
}

.bottom .active{
color:#6848e8
}

.modal{
display:none;
position:fixed;
inset:0;
background:#00000066;
z-index:100;
align-items:center;
justify-content:center;
padding:20px
}

.modal-box{
width:100%;
max-width:420px;
background:white;
border-radius:22px;
padding:22px;
box-shadow:0 20px 50px #00000033
}

.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}

.modal-header h2{
font-size:21px
}

.close{
background:#f1f1f5;
border:0;
width:35px;
height:35px;
border-radius:50%;
font-size:20px;
cursor:pointer
}

.network{
background:#f5f2ff;
border-radius:12px;
padding:13px;
margin-bottom:16px
}

.network small{
display:block;
color:#777;
margin-bottom:5px
}

.network strong{
color:#6848e8
}

.address{
background:#f7f7f9;
border:1px solid #eee;
border-radius:12px;
padding:13px;
font-size:13px;
word-break:break-all;
margin-bottom:12px
}

.copy{
width:100%;
padding:12px;
border:0;
border-radius:10px;
background:#6848e8;
color:white;
font-weight:bold;
cursor:pointer
}

.input-group{
margin-bottom:15px
}

.input-group label{
display:block;
font-size:13px;
font-weight:bold;
color:#555;
margin-bottom:7px
}

.input{
width:100%;
height:48px;
border:1px solid #e5e5e8;
border-radius:12px;
padding:0 13px;
font-size:15px;
outline:none;
background:#fafafd
}

.input:focus{
border-color:#6848e8
}

.withdraw-submit{
width:100%;
padding:13px;
border:0;
border-radius:11px;
background:#191827;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:5px
}

.demo-note{
margin-top:15px;
font-size:12px;
color:#888;
line-height:1.5;
text-align:center
}

</style>

</head>
