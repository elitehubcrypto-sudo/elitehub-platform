<title>EliteHub - Profile</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#fff;
color:#29292f;
padding-bottom:90px;
}

.header{
height:70px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
border-bottom:1px solid #f1f1f1;
background:#fff;
}

.header-title{
font-size:25px;
font-weight:700;
}

.header-left{
position:absolute;
left:25px;
font-size:34px;
line-height:1;
cursor:pointer;
font-weight:300;
}

.header-right{
position:absolute;
right:22px;
display:flex;
gap:22px;
align-items:center;
}

.header-right button{
border:0;
background:none;
font-size:27px;
cursor:pointer;
color:#222;
}

/* PROFILE */

.profile{
padding:28px 28px 25px;
border-bottom:1px solid #eeeeee;
}

.profile-top{
display:flex;
align-items:center;
gap:18px;
}

.avatar{
width:105px;
height:105px;
border-radius:50%;
background:linear-gradient(
145deg,
#2456d9,
#3159d8
);
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
flex-shrink:0;
}

.avatar-head{
width:38px;
height:38px;
border-radius:50%;
background:#fff;
position:absolute;
top:22px;
}

.avatar-body{
width:70px;
height:48px;
border-radius:50% 50% 0 0;
background:#fff;
position:absolute;
bottom:-3px;
}

.profile-info{
flex:1;
}

.username{
font-size:23px;
font-weight:500;
margin-bottom:10px;
}

.uid{
font-size:16px;
color:#999;
display:flex;
align-items:center;
gap:8px;
cursor:pointer;
}

.copy-icon{
font-size:23px;
color:#b477e8;
}

.profile-arrow{
font-size:32px;
color:#333;
}

gap:6px;
margin-top:18px;
