<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteHub - Profile</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#29292f;
    padding-bottom:90px;
}

/* HEADER */

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid #eeeeee;
    background:#fff;
}

.header-title{
    font-size:25px;
    font-weight:700;
}

.header-left{
    position:absolute;
    left:22px;
    font-size:34px;
    line-height:1;
    cursor:pointer;
    font-weight:300;
}

.header-right{
    position:absolute;
    right:20px;
    display:flex;
    gap:18px;
    align-items:center;
}

.header-right button{
    border:0;
    background:none;
    font-size:24px;
    cursor:pointer;
    color:#222;
}

/* PROFILE */

.profile{
    padding:28px 25px 24px;
    border-bottom:1px solid #eeeeee;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:17px;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:linear-gradient(145deg,#2456d9,#3159d8);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
}

.avatar-head{
    width:37px;
    height:37px;
    border-radius:50%;
    background:#fff;
    position:absolute;
    top:21px;
}

.avatar-body{
    width:69px;
    height:47px;
    border-radius:50% 50% 0 0;
    background:#fff;
    position:absolute;
    bottom:-3px;
}

.profile-info{
    flex:1;
}

.username{
    font-size:22px;
    font-weight:500;
    margin-bottom:9px;
}

.uid{
    font-size:15px;
    color:#999;
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
}

.copy-icon{
    font-size:20px;
    color:#a56ee8;
}

.profile-arrow{
    font-size:31px;
    color:#333;
}

.verified{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:16px;
    background:#dff7ef;
    color:#20aa86;
    padding:6px 13px;
    border-radius:20px;
    font-size:14px;
    font-weight:600;
}

/* SECTIONS */

.section{
    padding:25px 22px 5px;
}

.section-title{
    font-size:17px;
    font-weight:600;
    color:#222;
    margin-bottom:18px;
}

/* QUICK ENTRY */

.quick-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.quick-item{
    text-align:center;
    cursor:pointer;
}

.quick-icon{
    width:52px;
    height:52px;
    margin:0 auto 9px;
    border-radius:15px;
    background:#f7f4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    color:#8057c9;
}

.quick-item span{
    display:block;
    font-size:11px;
    color:#555;
    white-space:nowrap;
}

/* OTHERS */

.other-list{
    background:#fff;
}

.other-item{
    height:60px;
    display:flex;
    align-items:center;
    border-bottom:1px solid #eeeeee;
    cursor:pointer;
}

.other-icon{
    width:42px;
    font-size:21px;
    color:#7654bd;
}

.other-name{
    flex:1;
    font-size:15px;
    color:#333;
}

.other-arrow{
    font-size:25px;
    color:#aaa;
}

/* SIGN OUT */

.signout{
    margin:30px 22px 15px;
    height:50px;
    border:1px solid #ef4f55;
    border-radius:10px;
    background:#fff;
    color:#ef4f55;
    font-size:16px;
    font-weight:600;
    width:calc(100% - 44px);
    cursor:pointer;
}

.version{
    text-align:center;
    color:#aaa;
    font-size:12px;
    margin-top:10px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:75px;
    background:#fff;
    border-top:1px solid #eeeeee;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
}

.bottom-nav div{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:#999;
    cursor:pointer;
}

.bottom-nav b{
    font-size:22px;
    font-weight:400;
}

.bottom-nav .active{
    color:#7654bd;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#29292f;
    color:#fff;
    padding:11px 18px;
    border-radius:8px;
    font-size:13px;
    display:none;
    z-index:500;
    white-space:nowrap;
}

/* DARK MODE */

body.dark{
    background:#111216;
    color:#fff;
}

body.dark .header,
body.dark .profile,
body.dark .other-list,
body.dark .bottom-nav,
body.dark .signout{
    background:#111216;
}

body.dark .header{
    border-color:#25262c;
}

body.dark .profile{
    border-color:#25262c;
}

body.dark .header-title,
body.dark .header-right button,
body.dark .profile-arrow,
body.dark .section-title,
body.dark .other-name{
    color:#fff;
}

body.dark .uid,
body.dark .version{
    color:#888;
}

body.dark .other-item{
    border-color:#25262c;
}

body.dark .quick-icon{
    background:#211d2c;
}

body.dark .quick-item span{
    color:#bbb;
}

body.dark .bottom-nav{
    border-color:#25262c;
}

body.dark .bottom-nav div{
    color:#777;
}

body.dark .bottom-nav .active{
    color:#a77be8;
}

</style>

</head>
