<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>EliteHub Contract</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f7f7fb;
color:#191827;
padding-bottom:90px
}

header{
height:64px;
background:white;
border-bottom:1px solid #eee;
display:flex;
align-items:center;
padding:0 18px;
gap:15px;
position:sticky;
top:0;
z-index:10
}

.back{
font-size:30px;
cursor:pointer
}

.logo{
font-size:22px;
font-weight:800;
color:#6848e8
}

.container{
max-width:600px;
margin:auto;
padding:18px
}

.card{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 5px 18px #00000008
}

.label{
font-size:13px;
color:#888;
margin-bottom:8px
}

.select{
width:100%;
height:48px;
border:1px solid #ddd;
border-radius:12px;
padding:0 14px;
font-size:16px;
background:white;
outline:none
}

.price{
font-size:30px;
font-weight:800;
margin-top:5px
}

.change{
font-size:14px;
font-weight:bold;
margin-top:5px
}

.green{
color:#20a66a
}

.red{
color:#e54848
}

.direction{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px
}

.direction button{
height:48px;
border:0;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#eeeef3;
color:#555
}

.direction button.long.active{
background:#20a66a;
color:white
}

.direction button.short.active{
background:#e54848;
color:white
}

.leverage{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
margin-top:10px
}

.leverage button{
border:0;
background:#eeeef3;
border-radius:9px;
padding:10px 3px;
font-weight:bold;
cursor:pointer
}

.leverage button.active{
background:#6848e8;
color:white
}

.input{
width:100%;
height:48px;
border:1px solid #ddd;
border-radius:12px;
padding:0 13px;
font-size:16px;
outline:none
}

.input:focus{
border-color:#6848e8
}

.open-btn{
width:100%;
height:50px;
border:0;
border-radius:12px;
background:#6848e8;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px
}

.position{
border:1px solid #eee;
border-radius:15px;
padding:15px;
margin-top:10px
}

.position-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
}

.position-title{
font-weight:bold
}

.badge{
padding:5px 9px;
border-radius:8px;
font-size:11px;
font-weight:bold
}

.badge-long{
background:#e5f7ed;
color:#168a3b
}

.badge-short{
background:#fde8e8;
color:#c52d38
}

.position-row{
display:flex;
justify-content:space-between;
font-size:13px;
margin-top:8px;
color:#777
}

.position-row strong{
color:#191827
}

.pnl{
font-size:20px;
font-weight:bold;
margin-top:12px
}

.close-btn{
width:100%;
height:42px;
border:0;
border-radius:10px;
background:#191827;
color:white;
font-weight:bold;
margin-top:13px;
cursor:pointer
}

.empty{
text-align:center;
padding:25px;
color:#999;
font-size:14px
}

.demo{
font-size:12px;
line-height:1.5;
color:#888;
text-align:center;
margin-top:15px
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:white;
border-top:1px solid #eee;
display:flex;
justify-content:space-around;
align-items:center;
z-index:20
}

.bottom div{
text-align:center;
font-size:11px;
color:#999;
cursor:pointer
}

.bottom b{
display:block;
font-size:21px;
margin-bottom:4px
}

.bottom .active{
color:#6848e8
}

</style>

</head>

<body>


<header>

<div
class="back"
onclick="history.back()">

‹

</div>

<div class="logo">

EliteHub

</div>

</header>


<main class="container">


<!-- MARKET -->

<div class="card">

<div class="label">
Contract Market
</div>

<select
class="select"
id="symbol"
onchange="loadPrice()">

<option value="BTCUSDT">
BTC / USDT
</option>

<option value="ETHUSDT">
ETH / USDT
</option>

<option value="BNBUSDT">
BNB / USDT
</option>

<option value="SOLUSDT">
SOL / USDT
</option>

<option value="XRPUSDT">
XRP / USDT
</option>

<option value="DOGEUSDT">
DOGE / USDT
</option>

</select>

<div
class="price"
id="price">

Loading...

</div>

<div
class="change"
id="change">

--

</div>

</div>


<!-- DIRECTION -->

<div class="card">

<div class="label">
Position Direction
</div>

<div class="direction">

<button
class="long active"
id="longBtn"
onclick="setDirection('LONG')">

LONG

</button>

<button
class="short"
id="shortBtn"
onclick="setDirection('SHORT')">

SHORT

</button>

</div>

</div>


<!-- LEVERAGE -->

<div class="card">

<div class="label">
Leverage

</div>

<div class="leverage">

<button
class="active"
onclick="setLeverage(1,this)">

1x

</button>

<button
onclick="setLeverage(2,this)">

2x

</button>

<button
onclick="setLeverage(5,this)">

5x

</button>

<button
onclick="setLeverage(10,this)">

10x

</button>

<button
onclick="setLeverage(20,this)">

20x

</button>

</div>

</div>


<!-- MARGIN -->

<div class="card">

<div class="label">
Margin USDT
</div>

<input
class="input"
id="margin"
type="number"
min="1"
placeholder="Enter margin">

<button
class="open-btn"
onclick="openPosition()">

Open Simulated Position

</button>

<div class="demo">

This is a simulated contract trading interface.
No real orders or real funds are executed.

</div>

</div>


<!-- POSITIONS -->

<div class="card">

<div class="label">
Open Positions
</div>

<div
id="positions">

<div class="empty">

No open positions

</div>

</div>

</div>


</main>


<!-- BOTTOM -->

<nav class="bottom">

<div
onclick="location.href='index.html'">

<b>
▣
</b>

Assets

</div>

<div class="active">

<b>
◈
</b>

Contract

</div>

<div
onclick="location.href='trade.html'">

<b>
⇄
</b>

Trade

</div>

<div
onclick="location.href='market.html'">

<b>
⌁
</b>

Market

</div>

<div
onclick="location.href='index.html'">

<b>
⌂
</b>

Home

</div>

</nav>


<script>


let direction =
"LONG";

let leverage =
1;

let currentPrice =
0;

let positions = [];


/* =========================
   PRICE
========================= */

async function loadPrice(){

try{

const symbol =
document.getElementById(
"symbol"
).value;


const response =
await fetch(
"https://api.binance.com/api/v3/ticker/24hr?symbol="+
symbol
);


const data =
await response.json();


currentPrice =
Number(
data.lastPrice
);


const change =
Number(
data.priceChangePercent
);


document.getElementById(
"price"
).textContent =
"$"+
currentPrice.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:8
}
);


const changeElement =
document.getElementById(
"change"
);


changeElement.textContent =
(change>=0?"+":"")+
change.toFixed(2)+
"%";


changeElement.className =
"change "+
(change>=0?"green":"red");


updatePositions();

}
catch(error){

console.log(error);

}

}


/* =========================
   DIRECTION
========================= */

function setDirection(value){

direction =
value;


document
.getElementById("longBtn")
.classList.remove("active");


document
.getElementById("shortBtn")
.classList.remove("active");


if(value==="LONG"){

document
.getElementById("longBtn")
.classList.add("active");

}else{

document
.getElementById("shortBtn")
.classList.add("active");

}

}


/* =========================
   LEVERAGE
========================= */

function setLeverage(
value,
button
){

leverage =
value;


document
.querySelectorAll(".leverage button")
.forEach(
function(btn){

btn.classList.remove(
"active"
);

});


button.classList.add(
"active"
);

}


/* =========================
   OPEN POSITION
========================= */

function openPosition(){

const margin =
Number(
document.getElementById(
"margin"
).value
);


if(!Number.isFinite(margin) ||
margin<=0){

alert(
"Please enter a valid margin"
);

return;

}


if(!currentPrice){

alert(
"Market price is not available"
);

return;

}


const position = {

id:
Date.now(),

symbol:
document.getElementById(
"symbol"
).value,

direction:
direction,

leverage:
leverage,

margin:
margin,

entry:
currentPrice

};


positions.push(
position
);


document.getElementById(
"margin"
).value =
"";


renderPositions();

}


/* =========================
   CALCULATE PNL
========================= */

function calculatePnL(
position
){

if(!currentPrice){
return 0;
}


const difference =
currentPrice -
position.entry;


let percent;


if(position.direction==="LONG"){

percent =
difference /
position.entry;

}else{

percent =
-difference /
position.entry;

}


return position.margin *
position.leverage *
percent;

}


/* =========================
   UPDATE POSITIONS
========================= */

function updatePositions(){

if(!positions.length){

return;

}


renderPositions();

}


/* =========================
   RENDER POSITIONS
========================= */

function renderPositions(){

const container =
document.getElementById(
"positions"
);


if(!positions.length){

container.innerHTML =
'<div class="empty">No open positions</div>';

return;

}


container.innerHTML =
"";


positions.forEach(
function(position){

const pnl =
calculatePnL(
position
);


const pnlClass =
pnl>=0
? "green"
: "red";


const pnlText =
(pnl>=0?"+":"")+
pnl.toFixed(2)+
" USDT";


const badge =
position.direction==="LONG"
? "badge-long"
: "badge-short";


const div =
document.createElement(
"div"
);


div.className =
"position";


div.innerHTML =

'<div class="position-top">'+

'<div class="position-title">'+
position.symbol.replace(
"USDT",
" / USDT"
)+
'</div>'+

'<span class="badge '+
badge+
'">'+
position.direction+
'</span>'+

'</div>'+

'<div class="position-row">'+
'<span>Entry Price</span>'+
'<strong>'+
formatPrice(position.entry)+
'</strong>'+
'</div>'+

'<div class="position-row">'+
'<span>Current Price</span>'+
'<strong>'+
formatPrice(currentPrice)+
'</strong>'+
'</div>'+

'<div class="position-row">'+
'<span>Margin</span>'+
'<strong>'+
position.margin.toFixed(2)+
' USDT</strong>'+
'</div>'+

'<div class="position-row">'+
'<span>Leverage</span>'+
'<strong>'+
position.leverage+
'x</strong>'+
'</div>'+

'<div class="pnl '+pnlClass+'">'+
pnlText+
'</div>'+

'<button class="close-btn" '+
'onclick="closePosition('+
position.id+
')">'+
'Close Position'+
'</button>';


container.appendChild(
div
);

});

}


/* =========================
   CLOSE POSITION
========================= */

function closePosition(id){

positions =
positions.filter(
function(position){

return position.id !== id;

});


renderPositions();

}


/* =========================
   FORMAT
========================= */

function formatPrice(value){

if(!Number.isFinite(value)){

return "--";

}


if(value>=1000){

return "$"+
value.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


return "$"+
value.toFixed(4);

}


/* =========================
   START
========================= */

loadPrice();


setInterval(
loadPrice,
5000
);

</script>

</body>
</html>
