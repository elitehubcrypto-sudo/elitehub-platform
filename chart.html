<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>EliteHub Chart</title>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
background:#f7f7fb;
color:#191827;
padding-bottom:20px
}

.header{
height:64px;
background:#fff;
display:flex;
align-items:center;
gap:14px;
padding:0 16px;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:10
}

.back{
border:0;
background:#f1efff;
color:#6848e8;
width:40px;
height:40px;
border-radius:50%;
font-size:25px;
cursor:pointer
}

.title{
font-size:19px;
font-weight:bold
}

.container{
max-width:900px;
margin:auto;
padding:15px
}

.coin-card{
background:#fff;
border-radius:18px;
padding:18px;
margin-bottom:12px;
box-shadow:0 5px 18px #00000008
}

.coin-row{
display:flex;
justify-content:space-between;
align-items:center
}

.coin-name{
font-size:19px;
font-weight:bold
}

.coin-code{
font-size:13px;
color:#999;
margin-top:5px
}

.current-price{
font-size:22px;
font-weight:bold;
text-align:right
}

.change{
font-size:13px;
margin-top:5px;
text-align:right
}

.green{
color:#20a66a
}

.red{
color:#e54848
}

.timeframes{
display:flex;
gap:7px;
overflow-x:auto;
padding-bottom:5px;
margin-bottom:12px
}

.timeframes button{
border:0;
background:#fff;
color:#777;
padding:10px 14px;
border-radius:9px;
font-weight:bold;
white-space:nowrap;
cursor:pointer
}

.timeframes button.active{
background:#6848e8;
color:#fff
}

.chart-card{
background:#fff;
border-radius:18px;
padding:8px;
box-shadow:0 5px 18px #00000008;
overflow:hidden
}

.chart-title{
font-size:13px;
font-weight:bold;
color:#777;
padding:8px 8px 3px
}

#chart{
width:100%;
height:390px
}

#rsi{
width:100%;
height:160px
}

.status{
text-align:center;
font-size:11px;
color:#999;
padding:10px
}

</style>

</head>


<body>


<header class="header">

<button class="back"
onclick="goBack()">
‹
</button>

<div class="title"
id="pageTitle">
Loading...
</div>

</header>


<main class="container">


<section class="coin-card">

<div class="coin-row">


<div>

<div class="coin-name"
id="coinName">
Loading...
</div>

<div class="coin-code"
id="coinCode">
--- / USDT
</div>

</div>


<div>

<div class="current-price"
id="currentPrice">
Loading...
</div>

<div class="change"
id="priceChange">
--
</div>

</div>


</div>

</section>


<div class="timeframes">

<button
onclick="changeTimeframe('1m',this)">
1m
</button>

<button
onclick="changeTimeframe('5m',this)">
5m
</button>

<button
class="active"
onclick="changeTimeframe('15m',this)">
15m
</button>

<button
onclick="changeTimeframe('1h',this)">
1H
</button>

<button
onclick="changeTimeframe('4h',this)">
4H
</button>

<button
onclick="changeTimeframe('1d',this)">
1D
</button>

</div>


<section class="chart-card">


<div class="chart-title">
Price + EMA 20
</div>

<div id="chart"></div>


<div class="chart-title">
RSI 14
</div>

<div id="rsi"></div>


<div class="status"
id="status">
Connecting to market...
</div>


</section>


</main>


<script>


/* =====================================
   GET COIN INFORMATION FROM URL
===================================== */

const params =
new URLSearchParams(
window.location.search
);


const symbol =
params.get("symbol") || "BTCUSDT";


const coinName =
params.get("name") || "Bitcoin";


const code =
params.get("code") || "BTC";


document.getElementById(
"pageTitle"
).innerText =
coinName;


document.getElementById(
"coinName"
).innerText =
coinName;


document.getElementById(
"coinCode"
).innerText =
code + " / USDT";


/* =====================================
   BACK BUTTON
===================================== */

function goBack(){

history.back();

}


/* =====================================
   MAIN CHART
===================================== */

const chartElement =
document.getElementById("chart");


const chart =
LightweightCharts.createChart(
chartElement,
{

width:
chartElement.clientWidth,

height:390,

layout:{
background:{
color:"#ffffff"
},
textColor:"#777777"
},

grid:{
vertLines:{
color:"#f0f0f0"
},
horzLines:{
color:"#f0f0f0"
}
},

crosshair:{
mode:
LightweightCharts.CrosshairMode.Normal
},

rightPriceScale:{
borderColor:"#eeeeee"
},

timeScale:{
borderColor:"#eeeeee",
timeVisible:true,
secondsVisible:false
}

});


const candleSeries =
chart.addCandlestickSeries({

upColor:"#20a66a",

downColor:"#e54848",

borderUpColor:"#20a66a",

borderDownColor:"#e54848",

wickUpColor:"#20a66a",

wickDownColor:"#e54848"

});


/* =====================================
   EMA 20
===================================== */

const emaSeries =
chart.addLineSeries({

color:"#6848e8",

lineWidth:2,

title:"EMA 20",

priceLineVisible:false,

lastValueVisible:true

});


/* =====================================
   RSI CHART
===================================== */

const rsiElement =
document.getElementById("rsi");


const rsiChart =
LightweightCharts.createChart(
rsiElement,
{

width:
rsiElement.clientWidth,

height:160,

layout:{
background:{
color:"#ffffff"
},
textColor:"#777777"
},

grid:{
vertLines:{
color:"#f5f5f5"
},
horzLines:{
color:"#eeeeee"
}
},

rightPriceScale:{
borderColor:"#eeeeee"
},

timeScale:{
visible:false
}

});


const rsiSeries =
rsiChart.addLineSeries({

color:"#ff7a00",

lineWidth:2,

title:"RSI 14",

priceScaleId:"right"

});


/* =====================================
   RSI CALCULATION
===================================== */

function calculateRSI(
candles,
period=14
){

if(
candles.length <
period + 1
){

return [];

}


let gains=[];

let losses=[];


for(
let i=1;
i<candles.length;
i++
){

const change =
candles[i].close -
candles[i-1].close;


gains.push(
change > 0
? change
: 0
);


losses.push(
change < 0
? Math.abs(change)
: 0
);

}


let result=[];


for(
let i=period;
i<gains.length;
i++
){

let gain=0;

let loss=0;


for(
let j=i-period;
j<i;
j++
){

gain+=gains[j];

loss+=losses[j];

}


gain/=period;

loss/=period;


let rsi;


if(loss===0){

rsi=100;

}else{

const rs =
gain/loss;

rsi =
100 -
(100/(1+rs));

}


result.push({

time:
candles[i+1].time,

value:rsi

});

}


return result;

}


/* =====================================
   EMA CALCULATION
===================================== */

function calculateEMA(
candles,
period=20
){

if(
candles.length <
period
){

return [];

}


const multiplier =
2/(period+1);


let ema=0;


for(
let i=0;
i<period;
i++
){

ema+=
candles[i].close;

}


ema/=period;


let result=[];


result.push({

time:
candles[period-1].time,

value:ema

});


for(
let i=period;
i<candles.length;
i++
){

ema=
(
(candles[i].close-ema)
*multiplier
)+ema;


result.push({

time:
candles[i].time,

value:ema

});

}


return result;

}


/* =====================================
   CURRENT TIMEFRAME
===================================== */

let currentInterval="15m";


/* =====================================
   CHANGE TIMEFRAME
===================================== */

function changeTimeframe(
interval,
button
){

currentInterval=
interval;


document
.querySelectorAll(
".timeframes button"
)
.forEach(
btn=>{
btn.classList.remove(
"active"
);
}
);


button.classList.add(
"active"
);


loadChart();

}


/* =====================================
   LOAD REAL CANDLE DATA
===================================== */

async function loadChart(){

try{


document.getElementById(
"status"
).innerText =
"Loading real market data...";


const url =
"https://api.binance.com/api/v3/klines?symbol="
+
symbol
+
"&interval="
+
currentInterval
+
"&limit=200";


const response =
await fetch(url);


const data =
await response.json();


if(
!Array.isArray(data)
){

throw new Error(
"Invalid market data"
);

}


const candles =
data.map(
item=>({

time:
Math.floor(
item[0]/1000
),

open:
parseFloat(item[1]),

high:
parseFloat(item[2]),

low:
parseFloat(item[3]),

close:
parseFloat(item[4])

})
);


candleSeries.setData(
candles
);


/* EMA */

const ema =
calculateEMA(
candles,
20
);


emaSeries.setData(
ema
);


/* RSI */

const rsi =
calculateRSI(
candles,
14
);


rsiSeries.setData(
rsi
);


chart
.timeScale()
.fitContent();


rsiChart
.timeScale()
.fitContent();


document.getElementById(
"status"
).innerText =
"● Live market data";


}catch(error){

console.log(
"Chart error:",
error
);


document.getElementById(
"status"
).innerText =
"Unable to load market data";

}

}


/* =====================================
   LIVE CURRENT PRICE
===================================== */

async function updatePrice(){

try{


const response =
await fetch(

"https://api.binance.com/api/v3/ticker/24hr?symbol="
+
symbol

);


const data =
await response.json();


const price =
parseFloat(
data.lastPrice
);


const change =
parseFloat(
data.priceChangePercent
);


document.getElementById(
"currentPrice"
).innerText =
"$"
+
price.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:8
}
);


const changeElement =
document.getElementById(
"priceChange"
);


changeElement.innerText =
(change>=0 ? "+" : "")
+
change.toFixed(2)
+
"%";


changeElement.className =
"change "
+
(
change>=0
? "green"
: "red"
);


}catch(error){

console.log(
"Price error:",
error
);

}

}


/* =====================================
   RESIZE CHART
===================================== */

window.addEventListener(
"resize",
()=>{


chart.applyOptions({

width:
chartElement.clientWidth

});


rsiChart.applyOptions({

width:
rsiElement.clientWidth

});

});


/* =====================================
   START
===================================== */

loadChart();

updatePrice();


/* PRICE UPDATE */

setInterval(
updatePrice,
5000
);


/* CHART UPDATE */

setInterval(
loadChart,
15000
);

</script>


</body>

</html>
