<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>EliteHub Chart</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7fb;
color:#15151d;
padding-bottom:20px;
}

.header{
height:58px;
background:white;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
padding:0 18px;
gap:14px;
position:sticky;
top:0;
z-index:5;
}

.back{
font-size:32px;
cursor:pointer;
line-height:1;
}

.coinName{
font-size:19px;
font-weight:500;
}

.priceBox{
background:white;
padding:22px 24px 18px;
border-bottom:1px solid #ddd;
}

.price{
font-size:40px;
font-weight:bold;
letter-spacing:-1px;
}

.change{
font-size:19px;
font-weight:bold;
margin-top:7px;
}

.up{
color:#168a3b;
}

.down{
color:#c52d38;
}

.timeframes{
display:flex;
gap:10px;
padding:20px;
background:white;
border-bottom:1px solid #ddd;
overflow-x:auto;
}

.timeframes button{
border:0;
background:#eeeef3;
padding:14px 23px;
border-radius:14px;
font-size:17px;
font-weight:bold;
cursor:pointer;
white-space:nowrap;
}

.timeframes button.active{
background:#7143df;
color:white;
}

.chartBox{
margin:20px;
background:white;
border-radius:22px;
padding:10px;
box-shadow:0 3px 15px rgba(0,0,0,.06);
overflow:hidden;
}

canvas{
width:100%;
height:520px;
display:block;
}

.status{
font-size:11px;
color:#999;
padding:5px 10px 0;
}

.liveDot{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#20a66a;
margin-right:5px;
}

.rsiBox{
margin:20px;
padding:24px;
background:white;
border-radius:22px;
box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.rsiTitle{
font-size:18px;
color:#777;
}

.rsiValue{
font-size:34px;
font-weight:bold;
margin-top:9px;
}

.rsiStatus{
color:#777;
font-size:19px;
margin-top:5px;
}

</style>

</head>

<body>


<div class="header">

<div
class="back"
onclick="history.back()">

‹

</div>

<div
class="coinName"
id="coinName">

BTC

</div>

</div>


<div class="priceBox">

<div
class="price"
id="price">

Loading...

</div>

<div
class="change"
id="change">

Loading...

</div>

</div>


<div class="timeframes">

<button
class="active"
onclick="changeTimeframe('1m',this)">

1m

</button>

<button
onclick="changeTimeframe('5m',this)">

5m

</button>

<button
onclick="changeTimeframe('15m',this)">

15m

</button>

<button
onclick="changeTimeframe('1h',this)">

1H

</button>

<button
onclick="changeTimeframe('4h',this)">

4H

</button>

<button
onclick="changeTimeframe('1d',this)">

1D

</button>

</div>


<div class="chartBox">

<canvas
id="chart">
</canvas>

<div class="status">

<span class="liveDot"></span>
Live Binance Market Data

</div>

</div>


<div class="rsiBox">

<div class="rsiTitle">

RSI 14

</div>

<div
class="rsiValue"
id="rsi">

--

</div>

<div
class="rsiStatus"
id="rsiStatus">

Loading...

</div>

</div>


<script>


/* =====================================
   URL DATA
===================================== */

const params =
new URLSearchParams(
window.location.search
);


const symbol =
(
params.get("symbol")
||
"BTCUSDT"
).toUpperCase();


const name =
params.get("name")
||
"Bitcoin";


const code =
params.get("code")
||
"BTC";


document.getElementById(
"coinName"
).textContent =
code;


/* =====================================
   VARIABLES
===================================== */

let timeframe = "1m";

let candles = [];

let socket = null;

let lastPrice = 0;

let lastChange = 0;


/* =====================================
   PRICE FORMAT
===================================== */

function formatPrice(value){

if(!Number.isFinite(value)){
return "--";
}

if(value >= 1000){

return "$" +
value.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}

if(value >= 1){

return "$" +
value.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:4
}
);

}

return "$" +
value.toLocaleString(
"en-US",
{
minimumFractionDigits:4,
maximumFractionDigits:8
}
);

}


/* =====================================
   LOAD HISTORICAL CANDLES
===================================== */

async function loadHistory(){

try{

const url =
"https://api.binance.com/api/v3/klines" +
"?symbol=" +
encodeURIComponent(symbol) +
"&interval=" +
encodeURIComponent(timeframe) +
"&limit=200";


const response =
await fetch(
url,
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"Binance HTTP " +
response.status
);

}


const data =
await response.json();


if(!Array.isArray(data)){

throw new Error(
"Invalid Binance data"
);

}


candles =
data
.map(function(item){

return {

time:Number(item[0]),

open:Number(item[1]),

high:Number(item[2]),

low:Number(item[3]),

close:Number(item[4])

};

})
.filter(function(c){

return Number.isFinite(c.time) &&
Number.isFinite(c.open) &&
Number.isFinite(c.high) &&
Number.isFinite(c.low) &&
Number.isFinite(c.close);

});


drawChart();

updateRSI();

connectWebSocket();

}
catch(error){

console.log(
"History error:",
error
);

}

}


/* =====================================
   BINANCE WEBSOCKET
===================================== */

function connectWebSocket(){

disconnectWebSocket();


const stream =
symbol.toLowerCase() +
"@kline_" +
timeframe;


const url =
"wss://stream.binance.com:9443/ws/" +
stream;


socket =
new WebSocket(url);


socket.onopen =
function(){

console.log(
"Binance WebSocket connected:",
stream
);

};


socket.onmessage =
function(event){

try{

const message =
JSON.parse(event.data);


if(!message.k){
return;
}


const k =
message.k;


const candle = {

time:Number(k.t),

open:Number(k.o),

high:Number(k.h),

low:Number(k.l),

close:Number(k.c)

};


if(
!Number.isFinite(candle.time) ||
!Number.isFinite(candle.open) ||
!Number.isFinite(candle.high) ||
!Number.isFinite(candle.low) ||
!Number.isFinite(candle.close)
){

return;

}


/* =========================
   UPDATE CURRENT CANDLE
========================= */

if(
candles.length &&
candles[candles.length - 1].time === candle.time
){

candles[
candles.length - 1
] = candle;

}else{

candles.push(candle);

if(candles.length > 200){

candles.shift();

}

}


lastPrice =
candle.close;


/* =========================
   UPDATE PRICE
========================= */

document.getElementById(
"price"
).textContent =
formatPrice(
candle.close
);


/* =========================
   DRAW IMMEDIATELY
========================= */

drawChart();

updateRSI();

}
catch(error){

console.log(
"WebSocket message error:",
error
);

}

};


socket.onerror =
function(error){

console.log(
"WebSocket error:",
error
);

};


socket.onclose =
function(){

console.log(
"Binance WebSocket closed"
);

};

}


/* =====================================
   DISCONNECT SOCKET
===================================== */

function disconnectWebSocket(){

if(socket){

try{

socket.close();

}catch(error){

console.log(error);

}

socket = null;

}

}


/* =====================================
   LOAD 24H CHANGE
===================================== */

async function loadChange(){

try{

const url =
"https://api.binance.com/api/v3/ticker/24hr?symbol=" +
encodeURIComponent(symbol);


const response =
await fetch(
url,
{
cache:"no-store"
}
);


const data =
await response.json();


const change =
Number(
data.priceChangePercent
);


if(!Number.isFinite(change)){
return;
}


lastChange =
change;


const element =
document.getElementById(
"change"
);


element.textContent =
(change >= 0 ? "+" : "") +
change.toFixed(2) +
"%";


element.className =
"change " +
(change >= 0 ? "up" : "down");


if(
Number(data.lastPrice)
){

lastPrice =
Number(data.lastPrice);

document.getElementById(
"price"
).textContent =
formatPrice(lastPrice);

}

}
catch(error){

console.log(
"Change error:",
error
);

}

}


/* =====================================
   EMA
===================================== */

function calculateEMA(
values,
period
){

if(!values.length){
return [];
}


const result = [];

const multiplier =
2 /
(period + 1);


let ema =
values[0];


result.push(ema);


for(
let i=1;
i<values.length;
i++
){

ema =
(values[i] - ema) *
multiplier +
ema;


result.push(ema);

}


return result;

}


/* =====================================
   RSI
===================================== */

function calculateRSI(
values,
period
){

if(values.length <= period){

return null;

}


let gains = 0;

let losses = 0;


for(
let i=1;
i<=period;
i++
){

const diff =
values[i] -
values[i-1];


if(diff >= 0){

gains += diff;

}else{

losses +=
Math.abs(diff);

}

}


let avgGain =
gains / period;


let avgLoss =
losses / period;


for(
let i=period+1;
i<values.length;
i++
){

const diff =
values[i] -
values[i-1];


const gain =
diff > 0
? diff
: 0;


const loss =
diff < 0
? Math.abs(diff)
: 0;


avgGain =
(
avgGain *
(period - 1) +
gain
) / period;


avgLoss =
(
avgLoss *
(period - 1) +
loss
) / period;

}


if(avgLoss === 0){

return 100;

}


const rs =
avgGain / avgLoss;


const value =
100 -
(
100 /
(1 + rs)
);


return Number.isFinite(value)
? value
: null;

}


/* =====================================
   DRAW CHART
===================================== */

function drawChart(){

const canvas =
document.getElementById(
"chart"
);


const rect =
canvas.getBoundingClientRect();


const dpr =
window.devicePixelRatio ||
1;


canvas.width =
rect.width * dpr;


canvas.height =
rect.height * dpr;


const ctx =
canvas.getContext("2d");


ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);


const width =
rect.width;


const height =
rect.height;


ctx.clearRect(
0,
0,
width,
height
);


if(candles.length < 2){

return;

}


/* =====================================
   PRICE RANGE
===================================== */

let minPrice =
Infinity;

let maxPrice =
-Infinity;


candles.forEach(
function(c){

if(c.low < minPrice){

minPrice =
c.low;

}


if(c.high > maxPrice){

maxPrice =
c.high;

}

});


const range =
maxPrice -
minPrice;


const padding =
range > 0
? range * 0.08
: maxPrice * 0.01;


minPrice -=
padding;


maxPrice +=
padding;


/* =====================================
   CHART AREA
===================================== */

const left =
10;

const right =
70;

const top =
20;

const bottom =
20;


const chartWidth =
width -
left -
right;


const chartHeight =
height -
top -
bottom;


function priceY(price){

return top +
(
(maxPrice - price) /
(maxPrice - minPrice)
) *
chartHeight;

}


/* =====================================
   GRID
===================================== */

ctx.strokeStyle =
"#eeeeee";

ctx.lineWidth = 1;

ctx.font =
"13px Arial";


const gridCount = 6;


for(
let i=0;
i<gridCount;
i++
){

const ratio =
i /
(gridCount - 1);


const y =
top +
chartHeight *
ratio;


ctx.beginPath();

ctx.moveTo(
left,
y
);

ctx.lineTo(
width - right,
y
);

ctx.stroke();


const value =
maxPrice -
(
maxPrice - minPrice
) *
ratio;


ctx.fillStyle =
"#777";


ctx.fillText(
formatPrice(value),
width - right + 5,
y + 4
);

}


/* =====================================
   CANDLE WIDTH
===================================== */

const gap =
chartWidth /
candles.length;


const candleWidth =
Math.max(
2,
gap * 0.62
);


/* =====================================
   DRAW CANDLES
===================================== */

candles.forEach(
function(c,i){

const x =
left +
i * gap +
gap / 2;


const highY =
priceY(c.high);


const lowY =
priceY(c.low);


const openY =
priceY(c.open);


const closeY =
priceY(c.close);


const rising =
c.close >= c.open;


const candleColor =
rising
? "#168a3b"
: "#d02f3c";


ctx.strokeStyle =
candleColor;

ctx.fillStyle =
candleColor;

ctx.lineWidth = 1;


/* wick */

ctx.beginPath();

ctx.moveTo(
x,
highY
);

ctx.lineTo(
x,
lowY
);

ctx.stroke();


/* body */

const bodyTop =
Math.min(
openY,
closeY
);


const bodyHeight =
Math.max(
1,
Math.abs(
openY -
closeY
)
);


ctx.fillRect(
x -
candleWidth / 2,
bodyTop,
candleWidth,
bodyHeight
);

});


/* =====================================
   EMA 20
===================================== */

const closes =
candles.map(
function(c){
return c.close;
});


const ema =
calculateEMA(
closes,
20
);


ctx.strokeStyle =
"#7143df";

ctx.lineWidth = 2;

ctx.beginPath();


let started = false;


ema.forEach(
function(value,i){

if(!Number.isFinite(value)){
return;
}


const x =
left +
i * gap +
gap / 2;


const y =
priceY(value);


if(!started){

ctx.moveTo(
x,
y
);

started = true;

}else{

ctx.lineTo(
x,
y
);

}

});


ctx.stroke();


/* =====================================
   CURRENT PRICE LINE
===================================== */

if(
Number.isFinite(lastPrice) &&
lastPrice > 0
){

const currentY =
priceY(lastPrice);


ctx.strokeStyle =
"#999";

ctx.setLineDash([
4,
4
]);


ctx.beginPath();

ctx.moveTo(
left,
currentY
);

ctx.lineTo(
width - right,
currentY
);

ctx.stroke();

ctx.setLineDash([]);


ctx.fillStyle =
"#15151d";

ctx.font =
"12px Arial";

ctx.fillText(
formatPrice(lastPrice),
width - right + 5,
currentY - 5
);

}

}


/* =====================================
   UPDATE RSI
===================================== */

function updateRSI(){

const closes =
candles.map(
function(c){
return c.close;
});


const value =
calculateRSI(
closes,
14
);


if(value === null){

return;

}


document.getElementById(
"rsi"
).textContent =
value.toFixed(2);


let status =
"Neutral";


if(value >= 70){

status =
"Overbought";

}
else if(value <= 30){

status =
"Oversold";

}


document.getElementById(
"rsiStatus"
).textContent =
status;

}


/* =====================================
   CHANGE TIMEFRAME
===================================== */

function changeTimeframe(
newTimeframe,
button
){

timeframe =
newTimeframe;


document
.querySelectorAll(
".timeframes button"
)
.forEach(
function(btn){

btn.classList.remove(
"active"
);

});


button.classList.add(
"active"
);


candles = [];


loadHistory();

}


/* =====================================
   RESIZE
===================================== */

window.addEventListener(
"resize",
function(){

drawChart();

});


/* =====================================
   START
===================================== */

loadHistory();

loadChange();


/* Update 24h percentage every 5 seconds */

setInterval(
loadChange,
5000
);

</script>

</body>
</html>
