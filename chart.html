<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>EliteHub Chart</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7fb;
color:#181827;
}

.header{
height:64px;
background:#fff;
display:flex;
align-items:center;
padding:0 16px;
border-bottom:1px solid #e5e5e5;
}

.back{
font-size:32px;
margin-right:14px;
cursor:pointer;
}

.title{
font-size:20px;
font-weight:700;
}

.symbol{
font-size:13px;
color:#777;
margin-top:3px;
}

.price-box{
background:#fff;
padding:15px 16px;
border-bottom:1px solid #e5e5e5;
}

.price{
font-size:27px;
font-weight:700;
}

.change{
font-size:14px;
font-weight:600;
margin-top:5px;
}

.green{
color:#16a34a;
}

.red{
color:#dc2626;
}

.timeframes{
display:flex;
gap:8px;
padding:12px;
background:#fff;
border-bottom:1px solid #e5e5e5;
overflow-x:auto;
}

.timeframes button{
border:0;
background:#f0f0f4;
padding:9px 15px;
border-radius:8px;
font-size:14px;
font-weight:600;
white-space:nowrap;
}

.timeframes button.active{
background:#7048ee;
color:#fff;
}

.chart-box{
margin:12px;
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

#chart{
display:block;
width:100%;
height:440px;
}

.loading{
text-align:center;
padding:20px;
color:#777;
font-size:14px;
}

.rsi-box{
margin:12px;
padding:15px;
background:#fff;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.rsi-title{
font-size:13px;
color:#777;
}

.rsi{
font-size:22px;
font-weight:700;
margin-top:5px;
}

.status{
font-size:13px;
color:#777;
margin-top:4px;
}

</style>

</head>


<body>


<div class="header">

<div
class="back"
onclick="history.back()"
>
‹
</div>

<div>

<div
class="title"
id="coinName"
>
Bitcoin
</div>

<div
class="symbol"
id="coinSymbol"
>
BTC
</div>

</div>

</div>


<div class="price-box">

<div
class="price"
id="price"
>
Loading...
</div>

<div
class="change"
id="change"
>
--
</div>

</div>


<div class="timeframes">

<button
onclick="changeTimeframe('1m',this)"
>
1m
</button>

<button
onclick="changeTimeframe('5m',this)"
>
5m
</button>

<button
class="active"
onclick="changeTimeframe('15m',this)"
>
15m
</button>

<button
onclick="changeTimeframe('1h',this)"
>
1H
</button>

<button
onclick="changeTimeframe('4h',this)"
>
4H
</button>

<button
onclick="changeTimeframe('1d',this)"
>
1D
</button>

</div>


<div class="chart-box">

<canvas id="chart"></canvas>

<div
class="loading"
id="loading"
>
Loading chart...
</div>

</div>


<div class="rsi-box">

<div class="rsi-title">
RSI 14
</div>

<div
class="rsi"
id="rsi"
>
--
</div>

<div
class="status"
id="rsiStatus"
>
Loading...
</div>

</div>


<script>


/* =========================
COIN INFORMATION
========================= */

const params =
new URLSearchParams(
window.location.search
);


let symbol =
params.get("symbol") ||
"BTCUSDT";


let name =
params.get("name") ||
"Bitcoin";


let code =
params.get("code") ||
"BTC";


document.getElementById(
"coinName"
).innerText = name;


document.getElementById(
"coinSymbol"
).innerText = code;


/* =========================
SETTINGS
========================= */

let timeframe = "15m";

let candles = [];


/* =========================
CANVAS
========================= */

const canvas =
document.getElementById("chart");

const ctx =
canvas.getContext("2d");


function resizeCanvas(){

const rect =
canvas.getBoundingClientRect();

const ratio =
window.devicePixelRatio || 1;

canvas.width =
rect.width * ratio;

canvas.height =
rect.height * ratio;

ctx.setTransform(
ratio,
0,
0,
ratio,
0,
0
);

drawChart();

}


window.addEventListener(
"resize",
resizeCanvas
);


/* =========================
BINANCE DATA
========================= */

async function loadChart(){

document.getElementById(
"loading"
).innerText =
"Loading chart...";


try{

const url =
"https://api.binance.com/api/v3/klines?symbol="
+
encodeURIComponent(symbol)
+
"&interval="
+
encodeURIComponent(timeframe)
+
"&limit=300";


const response =
await fetch(url);


if(!response.ok){

throw new Error(
"Binance API error"
);

}


const data =
await response.json();


if(!Array.isArray(data) ||
data.length === 0){

throw new Error(
"No market data"
);

}


candles =
data.map(function(item){

return {

time:Number(item[0]),

open:Number(item[1]),

high:Number(item[2]),

low:Number(item[3]),

close:Number(item[4])

};

});


document.getElementById(
"loading"
).style.display =
"none";


drawChart();

calculateRSI();


}catch(error){

console.log(error);


document.getElementById(
"loading"
).style.display =
"block";


document.getElementById(
"loading"
).innerText =
"Unable to load market data";

}

}


/* =========================
PRICE
========================= */

async function loadPrice(){

try{

const response =
await fetch(
"https://api.binance.com/api/v3/ticker/24hr?symbol="
+
encodeURIComponent(symbol)
);


if(!response.ok){

throw new Error(
"Price error"
);

}


const data =
await response.json();


const price =
Number(data.lastPrice);


const change =
Number(data.priceChangePercent);


let formatted;


if(price >= 1000){

formatted =
price.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}else if(price >= 1){

formatted =
price.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:6
}
);

}else{

formatted =
price.toLocaleString(
"en-US",
{
minimumFractionDigits:4,
maximumFractionDigits:8
}
);

}


document.getElementById(
"price"
).innerText =
"$" + formatted;


const changeElement =
document.getElementById(
"change"
);


changeElement.innerText =
(change >= 0 ? "+" : "")
+
change.toFixed(2)
+
"%";


changeElement.className =
"change " +
(
change >= 0
? "green"
: "red"
);


}catch(error){

console.log(error);

}

}


/* =========================
EMA
========================= */

function calculateEMA(
data,
period
){

if(data.length < period){

return [];

}


let ema = 0;

for(
let i=0;
i<period;
i++
){

ema += data[i].close;

}

ema /= period;


const result = [];

const multiplier =
2 / (period + 1);


result.push({

index:period - 1,

value:ema

});


for(
let i=period;
i<data.length;
i++
){

ema =
(
(data[i].close - ema)
*
multiplier
)
+
ema;


result.push({

index:i,

value:ema

});

}


return result;

}


/* =========================
RSI
========================= */

function calculateRSI(){

if(candles.length < 15){

return;

}


let gain = 0;

let loss = 0;


for(
let i=1;
i<=14;
i++
){

const diff =
candles[i].close -
candles[i-1].close;


if(diff >= 0){

gain += diff;

}else{

loss += Math.abs(diff);

}

}


let avgGain =
gain / 14;

let avgLoss =
loss / 14;


for(
let i=15;
i<candles.length;
i++
){

const diff =
candles[i].close -
candles[i-1].close;


const currentGain =
diff > 0
? diff
: 0;


const currentLoss =
diff < 0
? Math.abs(diff)
: 0;


avgGain =
(
avgGain * 13 +
currentGain
) / 14;


avgLoss =
(
avgLoss * 13 +
currentLoss
) / 14;

}


let rsi;


if(avgLoss === 0){

rsi = 100;

}else{

const rs =
avgGain / avgLoss;


rsi =
100 -
(
100 /
(1 + rs)
);

}


document.getElementById(
"rsi"
).innerText =
rsi.toFixed(2);


let status;


if(rsi >= 70){

status =
"Overbought";

}else if(rsi <= 30){

status =
"Oversold";

}else{

status =
"Neutral";

}


document.getElementById(
"rsiStatus"
).innerText =
status;

}


/* =========================
DRAW CHART
========================= */

function drawChart(){

if(candles.length === 0){

return;

}


const width =
canvas.clientWidth;

const height =
canvas.clientHeight;


ctx.clearRect(
0,
0,
width,
height
);


/* Background */

ctx.fillStyle =
"#ffffff";

ctx.fillRect(
0,
0,
width,
height
);


/* Chart margins */

const left = 10;

const right = 65;

const top = 20;

const bottom = 35;


const chartWidth =
width - left - right;

const chartHeight =
height - top - bottom;


/* Visible candles */

const visible =
candles.slice(-80);


let highest =
-Math.infinity;

let lowest =
Math.infinity;


visible.forEach(function(c){

if(c.high > highest){

highest = c.high;

}

if(c.low < lowest){

lowest = c.low;

}

});


const padding =
(highest - lowest) * 0.08;


highest += padding;

lowest -= padding;


const priceRange =
highest - lowest;


function y(price){

return top +
(
(highest - price)
/
priceRange
)
*
chartHeight;

}


/* Grid */

ctx.strokeStyle =
"#eeeeee";

ctx.lineWidth = 1;


for(
let i=0;
i<=5;
i++
){

const gy =
top +
(
chartHeight / 5
)
*
i;


ctx.beginPath();

ctx.moveTo(
left,
gy
);

ctx.lineTo(
width-right,
gy
);

ctx.stroke();


const value =
highest -
(
priceRange / 5
)
*
i;


ctx.fillStyle =
"#777";

ctx.font =
"11px Arial";

ctx.fillText(
formatChartPrice(value),
width-right+5,
gy+4
);

}


/* Candles */

const candleWidth =
chartWidth /
visible.length;


visible.forEach(
function(c,index){

const x =
left +
index *
candleWidth +
candleWidth / 2;


const openY =
y(c.open);

const closeY =
y(c.close);

const highY =
y(c.high);

const lowY =
y(c.low);


const bullish =
c.close >= c.open;


ctx.strokeStyle =
bullish
? "#16a34a"
: "#dc2626";


ctx.fillStyle =
bullish
? "#16a34a"
: "#dc2626";


/* Wick */

ctx.beginPath();

ctx.moveTo(
x,
highY
);

ctx.lineTo(
x,
lowY
);

ctx.stroke();


/* Body */

const bodyTop =
Math.min(
openY,
closeY
);


const bodyHeight =
Math.max(
1,
Math.abs(
closeY-openY
)
);


ctx.fillRect(
x-candleWidth*0.32,
bodyTop,
candleWidth*0.64,
bodyHeight
);

});


/* EMA */

const emaData =
calculateEMA(
candles,
20
);


ctx.strokeStyle =
"#7048ee";

ctx.lineWidth = 2;

ctx.beginPath();


let started = false;


emaData.forEach(
function(point){

const startIndex =
candles.length -
visible.length;


if(point.index < startIndex){

return;

}


const visibleIndex =
point.index -
startIndex;


if(
visibleIndex < 0 ||
visibleIndex >= visible.length
){

return;

}


const x =
left +
visibleIndex *
candleWidth +
candleWidth/2;


const yy =
y(point.value);


if(!started){

ctx.moveTo(
x,
yy
);

started = true;

}else{

ctx.lineTo(
x,
yy
);

}

});


ctx.stroke();


/* Current price line */

const last =
visible[visible.length-1];


const currentY =
y(last.close);


ctx.strokeStyle =
"#999";

ctx.setLineDash([
4,
4
]);


ctx.beginPath();

ctx.moveTo(
left,
currentY
);

ctx.lineTo(
width-right,
currentY
);

ctx.stroke();


ctx.setLineDash([]);


ctx.fillStyle =
"#181827";

ctx.font =
"12px Arial";

ctx.fillText(
formatChartPrice(last.close),
width-right+5,
currentY+4
);

}


/* =========================
PRICE FORMAT
========================= */

function formatChartPrice(
price
){

if(price >= 1000){

return price.toFixed(0);

}

if(price >= 1){

return price.toFixed(2);

}

return price.toFixed(5);

}


/* =========================
TIMEFRAME
========================= */

function changeTimeframe(
newTimeframe,
button
){

timeframe =
newTimeframe;


document
.querySelectorAll(
".timeframes button"
)
.forEach(function(btn){

btn.classList.remove(
"active"
);

});


button.classList.add(
"active"
);


loadChart();

}


/* =========================
START
========================= */

resizeCanvas();

loadChart();

loadPrice();


/* Update price */

setInterval(
loadPrice,
5000
);


/* Update chart */

setInterval(
loadChart,
30000
);


</script>


</body>

</html>
