<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>EliteHub Chart</title>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7fb;
color:#181827;
}

.header{
height:64px;
background:#ffffff;
display:flex;
align-items:center;
padding:0 16px;
border-bottom:1px solid #e5e5e5;
position:sticky;
top:0;
z-index:10;
}

.back{
font-size:25px;
margin-right:14px;
cursor:pointer;
}

.title{
font-size:20px;
font-weight:700;
}

.symbol{
font-size:13px;
color:#777;
margin-left:8px;
}

.price-box{
background:#ffffff;
padding:14px 16px;
border-bottom:1px solid #e5e5e5;
}

.price{
font-size:28px;
font-weight:700;
}

.change{
font-size:14px;
margin-top:5px;
font-weight:600;
}

.green{
color:#16a34a;
}

.red{
color:#dc2626;
}

.timeframes{
display:flex;
gap:8px;
padding:12px;
background:#ffffff;
overflow-x:auto;
border-bottom:1px solid #e5e5e5;
}

.timeframes button{
border:0;
background:#f1f1f5;
padding:8px 14px;
border-radius:8px;
font-weight:600;
color:#555;
cursor:pointer;
white-space:nowrap;
}

.timeframes button.active{
background:#7048ee;
color:white;
}

.chart-wrap{
background:#ffffff;
margin:12px;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

#chart{
width:100%;
height:470px;
}

.indicators{
background:#ffffff;
margin:12px;
padding:15px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.indicator-title{
font-size:14px;
font-weight:700;
margin-bottom:8px;
}

.rsi-value{
font-size:22px;
font-weight:700;
}

.status{
font-size:13px;
color:#777;
margin-top:5px;
}

@media(max-width:600px){

#chart{
height:440px;
}

.price{
font-size:25px;
}

}

</style>

</head>


<body>


<div class="header">

<div
class="back"
onclick="history.back()"
>
‹
</div>

<div>

<div class="title" id="coinName">
Loading...
</div>

<div class="symbol" id="coinSymbol">
</div>

</div>

</div>


<div class="price-box">

<div
class="price"
id="currentPrice"
>
Loading...
</div>

<div
class="change"
id="currentChange"
>
--
</div>

</div>


<div class="timeframes">

<button
data-interval="1m"
onclick="changeInterval('1m',this)"
>
1m
</button>

<button
data-interval="5m"
onclick="changeInterval('5m',this)"
>
5m
</button>

<button
data-interval="15m"
onclick="changeInterval('15m',this)"
>
15m
</button>

data-interval="1
