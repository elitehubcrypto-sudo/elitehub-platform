<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EliteHub Chart</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7fb;
  color:#15151d;
}

.header{
  height:55px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:15px;
}

.back{
  font-size:30px;
  cursor:pointer;
}

.coinName{
  font-size:20px;
  font-weight:500;
}

.priceBox{
  background:white;
  padding:25px 25px 20px;
  border-bottom:1px solid #ddd;
}

.price{
  font-size:42px;
  font-weight:bold;
}

.change{
  font-size:20px;
  font-weight:bold;
  margin-top:8px;
}

.up{
  color:#168a3b;
}

.down{
  color:#c52d38;
}

.timeframes{
  display:flex;
  gap:12px;
  padding:22px 20px;
  background:white;
  border-bottom:1px solid #ddd;
  overflow-x:auto;
}

.timeframes button{
  border:0;
  background:#eeeef3;
  padding:15px 25px;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.timeframes button.active{
  background:#7143df;
  color:white;
}

.chartBox{
  margin:20px;
  background:white;
  border-radius:22px;
  padding:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

canvas{
  width:100%;
  height:500px;
  display:block;
}

.rsiBox{
  margin:20px;
  padding:25px;
  background:white;
  border-radius:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.rsiTitle{
  font-size:18px;
  color:#777;
}

.rsiValue{
  font-size:34px;
  font-weight:bold;
  margin-top:10px;
}

.rsiStatus{
  color:#777;
  font-size:20px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="history.back()">‹</div>
  <div class="coinName" id="coinName">BTC</div>
</div>

<div class="priceBox">
  <div class="price" id="price">Loading...</div>
  <div class="change" id="change">Loading...</div>
</div>

<div class="timeframes">
  <button class="active" onclick="changeTimeframe('1m',this)">1m</button>
  <button onclick="changeTimeframe('5m',this)">5m</button>
  <button onclick="changeTimeframe('15m',this)">15m</button>
  <button onclick="changeTimeframe('1h',this)">1H</button>
  <button onclick="changeTimeframe('4h',this)">4H</button>
  <button onclick="changeTimeframe('1d',this)">1D</button>
</div>

<div class="chartBox">
  <canvas id="chart"></canvas>
</div>

<div class="rsiBox">
  <div class="rsiTitle">RSI 14</div>
  <div class="rsiValue" id="rsi">--</div>
  <div class="rsiStatus" id="rsiStatus">Loading...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);

const symbol =
  params.get("symbol") || "BTCUSDT";

const name =
  params.get("name") || "Bitcoin";

const code =
  params.get("code") || "BTC";

let timeframe = "1m";
let candles = [];

document.getElementById("coinName").textContent = code;


/* =========================
   PRICE
========================= */

async function loadPrice(){

  try{

    const url =
      "https://api.binance.com/api/v3/ticker/24hr?symbol="
      + encodeURIComponent(symbol);

    const response = await fetch(url,{cache:"no-store"});

    const data = await response.json();

    const price = Number(data.lastPrice);
    const percent = Number(data.priceChangePercent);

    if(!Number.isFinite(price)){
      throw new Error("Invalid price");
    }

    document.getElementById("price").textContent =
      "$" + price.toLocaleString("en-US",{
        minimumFractionDigits:2,
        maximumFractionDigits:8
      });

    const changeElement =
      document.getElementById("change");

    changeElement.textContent =
      (percent >= 0 ? "+" : "") +
      percent.toFixed(2) + "%";

    changeElement.className =
      "change " + (percent >= 0 ? "up" : "down");

  }catch(error){

    console.log(error);

  }

}


/* =========================
   LOAD CANDLES
========================= */

async function loadChart(){

  try{

    const url =
      "https://api.binance.com/api/v3/klines" +
      "?symbol=" + encodeURIComponent(symbol) +
      "&interval=" + encodeURIComponent(timeframe) +
      "&limit=150";

    const response = await fetch(url,{cache:"no-store"});

    const data = await response.json();

    if(!Array.isArray(data)){
      throw new Error("Invalid candle data");
    }

    candles = data.map(function(item){

      return {
        time:Number(item[0]),
        open:Number(item[1]),
        high:Number(item[2]),
        low:Number(item[3]),
        close:Number(item[4])
      };

    }).filter(function(c){

      return Number.isFinite(c.time) &&
             Number.isFinite(c.open) &&
             Number.isFinite(c.high) &&
             Number.isFinite(c.low) &&
             Number.isFinite(c.close);

    });

    if(candles.length < 2){
      throw new Error("Not enough candles");
    }

    drawChart();
    updateRSI();

  }catch(error){

    console.log("Chart error:",error);

  }

}


/* =========================
   EMA
========================= */

function calculateEMA(values,period){

  if(values.length === 0) return [];

  const result = [];

  const multiplier =
    2 / (period + 1);

  let ema = values[0];

  result.push(ema);

  for(let i=1;i<values.length;i++){

    ema =
      (values[i] - ema) * multiplier + ema;

    result.push(ema);

  }

  return result;
}


/* =========================
   RSI
========================= */

function calculateRSI(values,period){

  if(values.length <= period){
    return null;
  }

  let gains = 0;
  let losses = 0;

  for(let i=1;i<=period;i++){

    const difference =
      values[i] - values[i-1];

    if(difference >= 0){
      gains += difference;
    }else{
      losses += Math.abs(difference);
    }

  }

  let averageGain =
    gains / period;

  let averageLoss =
    losses / period;

  for(let i=period+1;i<values.length;i++){

    const difference =
      values[i] - values[i-1];

    const gain =
      difference > 0 ? difference : 0;

    const loss =
      difference < 0 ? Math.abs(difference) : 0;

    averageGain =
      ((averageGain * (period - 1)) + gain) / period;

    averageLoss =
      ((averageLoss * (period - 1)) + loss) / period;

  }

  if(averageLoss === 0){
    return 100;
  }

  const rs =
    averageGain / averageLoss;

  const rsi =
    100 - (100 / (1 + rs));

  return Number.isFinite(rsi) ? rsi : null;
}


/* =========================
   DRAW CHART
========================= */

function drawChart(){

  const canvas =
    document.getElementById("chart");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  const width = rect.width;
  const height = rect.height;

  ctx.clearRect(0,0,width,height);

  if(!candles.length) return;


  /* PRICE RANGE */

  let minPrice = Infinity;
  let maxPrice = -Infinity;

  candles.forEach(function(c){

    if(c.low < minPrice)
      minPrice = c.low;

    if(c.high > maxPrice)
      maxPrice = c.high;

  });

  if(!Number.isFinite(minPrice) ||
     !Number.isFinite(maxPrice)){
    return;
  }

  const range =
    maxPrice - minPrice;

  const padding =
    range * 0.08 || maxPrice * 0.01;

  minPrice -= padding;
  maxPrice += padding;


  /* GRID */

  ctx.strokeStyle = "#eeeeee";
  ctx.lineWidth = 1;

  const gridCount = 6;

  for(let i=0;i<gridCount;i++){

    const y =
      20 +
      (height - 40) *
      (i / (gridCount - 1));

    ctx.beginPath();
    ctx.moveTo(10,y);
    ctx.lineTo(width - 65,y);
    ctx.stroke();

    const value =
      maxPrice -
      (maxPrice - minPrice) *
      (i / (gridCount - 1));

    ctx.fillStyle = "#777";
    ctx.font = "13px Arial";
    ctx.fillText(
      formatPrice(value),
      width - 60,
      y + 4
    );

  }


  /* CANDLE SIZE */

  const chartWidth =
    width - 75;

  const candleWidth =
    Math.max(
      3,
      chartWidth / candles.length * 0.65
    );

  const gap =
    chartWidth / candles.length;


  function priceY(price){

    return 20 +
      (maxPrice - price) /
      (maxPrice - minPrice) *
      (height - 40);

  }


  /* CANDLES */

  candles.forEach(function(c,i){

    const x =
      10 + i * gap + gap / 2;

    const openY =
      priceY(c.open);

    const closeY =
      priceY(c.close);

    const highY =
      priceY(c.high);

    const lowY =
      priceY(c.low);

    const rising =
      c.close >= c.open;

    ctx.strokeStyle =
      rising ? "#168a3b" : "#d02f3c";

    ctx.fillStyle =
      rising ? "#168a3b" : "#d02f3c";

    /* wick */

    ctx.beginPath();

    ctx.moveTo(x,highY);
    ctx.lineTo(x,lowY);

    ctx.stroke();


    /* body */

    const bodyTop =
      Math.min(openY,closeY);

    const bodyHeight =
      Math.max(
        1,
        Math.abs(openY-closeY)
      );

    ctx.fillRect(
      x - candleWidth / 2,
      bodyTop,
      candleWidth,
      bodyHeight
    );

  });


  /* EMA */

  const closes =
    candles.map(c => c.close);

  const ema =
    calculateEMA(closes,20);

  ctx.strokeStyle = "#7143df";
  ctx.lineWidth = 2;
  ctx.beginPath();

  ema.forEach(function(value,i){

    if(!Number.isFinite(value)) return;

    const x =
      10 + i * gap + gap / 2;

    const y =
      priceY(value);

    if(i === 0){
      ctx.moveTo(x,y);
    }else{
      ctx.lineTo(x,y);
    }

  });

  ctx.stroke();

}


/* =========================
   FORMAT PRICE
========================= */

function formatPrice(value){

  if(value >= 1000){

    return "$" +
      value.toLocaleString("en-US",{
        maximumFractionDigits:0
      });

  }

  if(value >= 1){

    return "$" +
      value.toFixed(2);

  }

  return "$" +
    value.toFixed(6);

}


/* =========================
   RSI UPDATE
========================= */

function updateRSI(){

  const closes =
    candles.map(c => c.close);

  const value =
    calculateRSI(closes,14);

  if(value === null) return;

  document.getElementById("rsi").textContent =
    value.toFixed(2);

  let status = "Neutral";

  if(value >= 70){
    status = "Overbought";
  }else if(value <= 30){
    status = "Oversold";
  }

  document.getElementById("rsiStatus").textContent =
    status;

}


/* =========================
   TIMEFRAME
========================= */

function changeTimeframe(newTimeframe,button){

  timeframe =
    newTimeframe;

  document
    .querySelectorAll(".timeframes button")
    .forEach(function(btn){
      btn.classList.remove("active");
    });

  button.classList.add("active");

  loadChart();

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  function(){
    drawChart();
  }
);


/* =========================
   START
========================= */

loadPrice();
loadChart();

setInterval(loadPrice,5000);

setInterval(loadChart,30000);

</script>

</body>
</html>
