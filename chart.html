<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EliteHub Chart</title>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7fb;
color:#181827;
}

.header{
height:64px;
background:white;
display:flex;
align-items:center;
padding:0 16px;
border-bottom:1px solid #eee;
}

.back{
font-size:32px;
margin-right:15px;
cursor:pointer;
}

.title{
font-size:20px;
font-weight:700;
}

.symbol{
font-size:13px;
color:#777;
margin-top:3px;
}

.priceBox{
background:white;
padding:15px 16px;
border-bottom:1px solid #eee;
}

.price{
font-size:28px;
font-weight:700;
}

.change{
margin-top:5px;
font-size:14px;
font-weight:600;
}

.green{
color:#16a34a;
}

.red{
color:#dc2626;
}

.timeframes{
display:flex;
gap:8px;
padding:12px;
background:white;
overflow-x:auto;
}

.timeframes button{
border:0;
background:#f0f0f4;
padding:8px 14px;
border-radius:8px;
font-weight:600;
white-space:nowrap;
}

.timeframes button.active{
background:#7048ee;
color:white;
}

.chartBox{
margin:12px;
background:white;
border-radius:14px;
overflow:hidden;
}

#chart{
width:100%;
height:450px;
}

.rsiBox{
margin:12px;
padding:15px;
background:white;
border-radius:14px;
}

.rsiTitle{
font-size:13px;
color:#777;
}

.rsi{
font-size:22px;
font-weight:700;
margin-top:5px;
}

</style>

</head>

<body>


<div class="header">

<div class="back" onclick="history.back()">
‹
</div>

<div>

<div class="title" id="coinName">
Bitcoin
</div>

<div class="symbol" id="coinSymbol">
BTC
</div>

</div>

</div>


<div class="priceBox">

<div class="price" id="price">
Loading...
</div>

<div class="change" id="change">
--
</div>

</div>


<div class="timeframes">

<button onclick="setTimeframe('1m',this)">
1m
</button>

<button onclick="setTimeframe('5m',this)">
5m
</button>

<button onclick="setTimeframe('15m',this)" class="active">
15m
</button>

<button onclick="setTimeframe('1h',this)">
1H
</button>

<button onclick="setTimeframe('4h',this)">
4H
</button>

<button onclick="setTimeframe('1d',this)">
1D
</button>

</div>


<div class="chartBox">

<div id="chart"></div>

</div>


<div class="rsiBox">

<div class="rsiTitle">
RSI 14
</div>

<div class="rsi" id="rsi">
--
</div>

</div>


<script>


/* =========================
COIN
========================= */

const params =
new URLSearchParams(
window.location.search
);

let symbol =
params.get("symbol") || "BTCUSDT";

let name =
params.get("name") || "Bitcoin";

let code =
params.get("code") || "BTC";


document.getElementById(
"coinName"
).innerText = name;

document.getElementById(
"coinSymbol"
).innerText = code;


/* =========================
CHART
========================= */

const container =
document.getElementById("chart");

const chart =
LightweightCharts.createChart(
container,
{
width:container.clientWidth,
height:450,

layout:{
background:{
color:"#ffffff"
},
textColor:"#555"
},

grid:{
vertLines:{
color:"#eeeeee"
},
horzLines:{
color:"#eeeeee"
}
},

rightPriceScale:{
borderColor:"#dddddd"
},

timeScale:{
borderColor:"#dddddd",
timeVisible:true
}

});


const candles =
chart.addCandlestickSeries({

upColor:"#16a34a",
downColor:"#dc2626",

borderUpColor:"#16a34a",
borderDownColor:"#dc2626",

wickUpColor:"#16a34a",
wickDownColor:"#dc2626"

});


const ema =
chart.addLineSeries({

color:"#7048ee",
lineWidth:2,

priceLineVisible:false,

lastValueVisible:false

});


/* =========================
TIMEFRAME
========================= */

let timeframe = "15m";


/* =========================
LOAD DATA
========================= */

async function loadChart(){

try{

const url =
"https://api.binance.com/api/v3/klines?symbol="
+
symbol
+
"&interval="
+
timeframe
+
"&limit=500";


const response =
await fetch(url);

const data =
await response.json();


if(!Array.isArray(data)){

console.log(data);

return;

}


const formatted =
data.map(function(item){

return {

time:item[0]/1000,

open:Number(item[1]),

high:Number(item[2]),

low:Number(item[3]),

close:Number(item[4])

};

});


candles.setData(formatted);


/* EMA */

const emaData = [];

const period = 20;

if(formatted.length >= period){

let value = 0;

for(
let i=0;
i<period;
i++
){

value += formatted[i].close;

}

value /= period;

emaData.push({

time:formatted[period-1].time,

value:value

});


const multiplier =
2/(period+1);


for(
let i=period;
i<formatted.length;
i++
){

value =
(formatted[i].close-value)
*
multiplier
+
value;


emaData.push({

time:formatted[i].time,

value:value

});

}

}


ema.setData(emaData);


/* RSI */

calculateRSI(formatted);


chart.timeScale().fitContent();


}catch(error){

console.log(
"Chart error:",
error
);

}

}


/* =========================
PRICE
========================= */

async function loadPrice(){

try{

const response =
await fetch(
"https://api.binance.com/api/v3/ticker/24hr?symbol="
+
symbol
);


const data =
await response.json();


const price =
Number(data.lastPrice);

const change =
Number(data.priceChangePercent);


document.getElementById(
"price"
).innerText =
"$" +
price.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:8
}
);


const changeElement =
document.getElementById("change");


changeElement.innerText =
(change >= 0 ? "+" : "")
+
change.toFixed(2)
+
"%";


changeElement.className =
"change " +
(change >= 0 ? "green" : "red");


}catch(error){

console.log(
"Price error:",
error
);

}

}


/* =========================
RSI
========================= */

function calculateRSI(data){

if(data.length < 15){

return;

}

let gain = 0;
let loss = 0;

for(
let i=1;
i<=14;
i++
){

const difference =
data[i].close -
data[i-1].close;

if(difference >= 0){

gain += difference;

}else{

loss += Math.abs(difference);

}

}


let avgGain =
gain / 14;

let avgLoss =
loss / 14;


for(
let i=15;
i<data.length;
i++
){

const difference =
data[i].close -
data[i-1].close;

const currentGain =
difference > 0
? difference
: 0;

const currentLoss =
difference < 0
? Math.abs(difference)
: 0;


avgGain =
(
avgGain * 13 +
currentGain
) / 14;


avgLoss =
(
avgLoss * 13 +
currentLoss
) / 14;

}


let rsi;

if(avgLoss === 0){

rsi = 100;

}else{

const rs =
avgGain / avgLoss;

rsi =
100 -
(
100 /
(1 + rs)
);

}


document.getElementById(
"rsi"
).innerText =
rsi.toFixed(2);

}


/* =========================
CHANGE TIMEFRAME
========================= */

function setTimeframe(
newTimeframe,
button
){

timeframe =
newTimeframe;


document
.querySelectorAll(
".timeframes button"
)
.forEach(function(btn){

btn.classList.remove(
"active"
);

});


button.classList.add(
"active"
);


loadChart();

}


/* =========================
RESIZE
========================= */

window.addEventListener(
"resize",
function(){

chart.resize(
container.clientWidth,
450
);

}
);


/* =========================
START
========================= */

loadChart();

loadPrice();


setInterval(
loadPrice,
5000
);


setInterval(
loadChart,
30000
);


</script>

</body>

</html>
